<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ET Bingo - Login / Register</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; text-align: center; }
        .card { background: #1e1e1e; padding: 25px; border-radius: 12px; width: 100%; max-width: 350px; box-shadow: 0 4px 15px rgba(0,0,0,0.6); }
        input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #121212; color: white; font-size: 16px; }
        .btn { background: #4CAF50; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🎲 ET BINGO</h2>
        <p style="color: #aaa; font-size: 14px;">ለመጀመር ስምዎን እና ስልክ ቁጥርዎን ያስገቡ</p>
        <input type="text" id="name" placeholder="ሙሉ ስምዎ">
        <input type="text" id="phone" placeholder="ስልክ ቁጥር (ምሳሌ: 0911...)">
        <button class="btn" onclick="submitRegister()">ግባ / ይመዝገቡ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Already registered check
        const savedPhone = localStorage.getItem('bingo_phone');
        if(savedPhone) {
            fetch('/api/get_user?phone=' + encodeURIComponent(savedPhone))
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    window.location.href = '/account';
                }
            });
        }

        function submitRegister() {
            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            if(!name || !phone) return alert('እባክዎ ስም እና ስልክ ቁጥር ይሙሉ!');

            fetch('/api/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({name: name, phone: phone})
            }).then(res => res.json()).then(data => {
                if(data.success) {
                    localStorage.setItem('bingo_phone', phone);
                    window.location.href = '/account';
                } else {
                    alert(data.message);
                }
            });
        }
    </script>
</body>
</html>
