<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ET Bingo - Login / Register</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-sizing: border-box;
        }
        h2 {
            margin-bottom: 10px;
            color: #4CAF50;
        }
        p {
            color: #b0b0b0;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #2d2d2d;
            border: 1px solid #444;
            border-radius: 6px;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
        }
        input:focus {
            border-color: #4CAF50;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        .error-msg {
            color: #ff5252;
            font-size: 13px;
            margin-bottom: 15px;
            background: rgba(255, 82, 82, 0.1);
            padding: 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>🎲 ET BINGO</h2>
        <p>ለመግባት ወይም ለመመዝገብ መረጃዎን ያስገቡ</p>

        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="input-group">
                <input type="text" name="username" placeholder="ዩዘር ስም (Username)" required>
            </div>
            <div class="input-group">
                <input type="text" name="phone" placeholder="ስልክ ቁጥር (ምሳሌ: 0911...)">
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="ፓስወርድ (Password)" required>
            </div>
            <button type="submit">ግባ / ተመዝገብ (Login / Register)</button>
        </form>
    </div>

</body>
</html>
