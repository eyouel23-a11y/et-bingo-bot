<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ET BINGO</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #1c1c1e; color: white; margin: 0; padding: 12px; text-align: center; }
        .hidden { display: none !important; }
        .card { background: #2c2c2e; padding: 12px; border-radius: 12px; margin-bottom: 12px; }
        input { width: 80%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #444; background: #1c1c1e; color: white; }
        button { padding: 12px 20px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; background: #2ecc71; color: white; }
        button:disabled { background: #555 !important; color: #888 !important; cursor: not-allowed; }
        .btn-join { background: #e67e22; color: white; width: 100%; max-width: 340px; padding: 15px; font-size: 18px; margin-bottom: 10px; border-radius: 10px; }
        .btn-new-game { background: #3498db; color: white; width: 100%; max-width: 340px; padding: 15px; font-size: 16px; margin-top: 10px; }
        .status-badge { background: #3a3a3c; padding: 6px 12px; border-radius: 20px; display: inline-block; font-size: 13px; margin-bottom: 8px; color: #f1c40f; }

        .prize-card { background: linear-gradient(135deg, #f39c12, #d35400); padding: 10px; border-radius: 10px; margin-bottom: 10px; font-weight: bold; }

        .called-num-ball { width: 70px; height: 70px; border-radius: 50%; background: radial-gradient(circle at 25px 25px, #f39c12, #d35400); color: white; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: bold; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border: 3px solid #fff; }
        .balls-history { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0; justify-content: flex-start; scrollbar-width: none; }
        .small-ball { min-width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(circle at 12px 12px, #2ecc71, #27ae60); color: white; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.3); border: 1px solid #fff; }

        .board-header { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-width: 340px; margin: 0 auto 5px auto; font-weight: bold; font-size: 18px; color: #f1c40f; }
        .board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-width: 340px; margin: 0 auto 10px auto; }
        .cell { aspect-ratio: 1; background: #3a3a3c; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold; cursor: pointer; user-select: none; }
        .cell.marked { background: #e74c3c; }
        .cell.disabled-cell { opacity: 0.4; pointer-events: none; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 1000; }
        .success-box { background: #27ae60; color: white; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="regSection" class="card hidden">
        <h2>ምዝገባ 📝</h2>
        <p>ለመጫወት እባክዎ አስቀድመው ይወዝገቡ</p>
        <input type="text" id="regName" placeholder="ሙሉ ስም"><br>
        <input type="tel" id="regPhone" placeholder="ስልክ ቁጥር"><br>
        <button onclick="registerUser()">ተመዝገብ</button>
    </div>

    <div id="gameSection" class="hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; background:#2c2c2e; padding:10px 15px; border-radius:10px; margin-bottom:8px;">
            <div>👤 <span id="dispName">--</span></div>
            <div>💰 ባላንስ፦ <span id="dispBalance" style="color:#2ecc71; font-weight:bold;">0</span> ETB</div>
        </div>

        <div style="font-size:12px; color:#aaa;">Game ID: #<span id="gameId">--</span> | መደብ፦ <b style="color:#2ecc71;" id="dispFee">--</b> ETB</div>
        <div class="status-badge" id="gameStatusText">🔄 አድሚኑ ጨዋታውን እስኪጀምር ይበቁ...</div>

        <div class="prize-card">
            👥 ተሳታፊዎች፦ <span id="playerCount">0</span> ሰው | 🏆 የዚህ ጨዋታ አሸናፊ፦ <span id="prizeDisplay" style="font-size: 20px;">0</span> ETB
        </div>

        <div id="joinContainer">
            <button id="joinBtn" class="btn-join" onclick="joinGame()">🎮 በጨዋታው ተሳተፍ (Join Game)</button>
        </div>
        <div id="joinedStatus" class="success-box hidden">✅ በጨዋታው ተመዝግበዋል! ጨዋታው ሲጀመር ይከፈታል።</div>

        <div class="card">
            <div style="font-size: 13px; color: #aaa; margin-bottom: 5px;">የተጠራው ጥሪ፦</div>
            <div class="called-num-ball" id="currentNum">--</div>
            <div style="font-size: 12px; color: #aaa; margin-top: 8px; text-align: left;">ያለፉት ጥሪዎች፦</div>
            <div class="balls-history" id="ballsHistory"></div>
        </div>

        <div class="board-header">
            <div>B</div><div>I</div><div>N</div><div>G</div><div>O</div>
        </div>
        <div class="board disabled-cell" id="board"></div>

        <button id="bingoBtn" onclick="claimBingo()" disabled style="width:100%; max-width:340px; padding:15px; font-size:18px;">BINGO! 🎯</button>
        <button id="newGameBtn" class="btn-new-game hidden" onclick="resetForNewGame()">🔄 ለቀጣይ ጨዋታ ተዘጋጅ (New Game)</button>
    </div>

    <div class="modal" id="winModal">
        <div style="background:#2c2c2e; padding:25px; border-radius:15px; max-width:80%;">
            <h1 id="winTitle" style="color:#f1c40f;">🏆 BINGO!</h1>
            <p id="winMessage" style="font-size:16px; margin-bottom: 20px;"></p>
            <button onclick="closeModalAndPrepare()">እሺ (OK)</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const tgUser = tg.initDataUnsafe?.user;
        const tgId = tgUser?.id || 99988877; 
        let currentUser = null;
        let gameEnded = false;
        let calledNumbersList = [];
        let currentBoardState = [];
        let isJoined = false;

        function getRandomSample(min, max, count) {
            let arr = [];
            for (let i = min; i <= max; i++) arr.push(i);
            arr.sort(() => Math.random() - 0.5);
            return arr.slice(0, count);
        }

        function generateStandardBingoBoard() {
            const cols = {
                b: getRandomSample(1, 15, 5),
                i: getRandomSample(16, 30, 5),
                n: getRandomSample(31, 45, 4),
                g: getRandomSample(46, 60, 5),
                o: getRandomSample(61, 75, 5)
            };

            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            currentBoardState = [];

            for (let row = 0; row < 5; row++) {
                currentBoardState.push(cols.b[row]);
                currentBoardState.push(cols.i[row]);

                if (row === 2) {
                    currentBoardState.push('FREE');
                } else {
                    const nVal = row > 2 ? cols.n[row - 1] : cols.n[row];
                    currentBoardState.push(nVal);
                }

                currentBoardState.push(cols.g[row]);
                currentBoardState.push(cols.o[row]);
            }

            currentBoardState.forEach((val, idx) => {
                createCell(boardEl, val, idx, val === 'FREE');
            });
        }

        function createCell(parent, val, index, isFree = false) {
            const cell = document.createElement('div');
            cell.classList.add('cell');
            cell.dataset.index = index;
            cell.innerText = val;

            if (isFree) {
                cell.classList.add('marked');
            } else {
                cell.onclick = () => {
                    if (!isJoined) {
                        alert("❌ በቅድሚያ 'Join Game' የሚለውን በመጫን በጨዋታው ይሳተፉ!");
                        return;
                    }

                    const isCalled = calledNumbersList.some(call => {
                        const numOnly = parseInt(call.split('-')[1] || call);
                        return numOnly === val;
                    });

                    if (isCalled) {
                        cell.classList.toggle('marked');
                    } else {
                        tg.HapticFeedback?.notificationOccurred('error');
                        alert(`❌ ጥሪ ${val} ገና አልተጠራም! መጠራቱን ይጠብቁ።`);
                    }
                };
            }
            parent.appendChild(cell);
        }

        async function checkUser() {
            const res = await fetch('/api/check_user', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ telegram_id: tgId })
            });
            const data = await res.json();

            if (data.registered) {
                currentUser = data;
                isJoined = data.has_joined;
                document.getElementById('dispName').innerText = data.name;
                document.getElementById('dispBalance').innerText = data.balance;
                document.getElementById('regSection').classList.add('hidden');
                document.getElementById('gameSection').classList.remove('hidden');

                generateStandardBingoBoard();
                setInterval(checkStatus, 1000);
            } else {
                document.getElementById('regSection').classList.remove('hidden');
            }
        }

        async function registerUser() {
            const name = document.getElementById('regName').value;
            const phone = document.getElementById('regPhone').value;
            if(!name || !phone) return alert("እባክዎ ስም እና ስልክ ቁጥር ያስገቡ!");

            const res = await fetch('/api/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ telegram_id: tgId, name: name, phone: phone })
            });
            const data = await res.json();
            if(data.status === 'success') {
                checkUser();
            } else {
                alert(data.message);
            }
        }

        async function joinGame() {
            const res = await fetch('/api/join_game', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ telegram_id: tgId })
            });
            const data = await res.json();

            if (data.status === 'success') {
                isJoined = true;
                alert("🎉 " + data.message);
                checkUser();
            } else {
                alert(data.message);
            }
        }

        async function checkStatus() {
            try {
                const res = await fetch('/api/game_status');
                const data = await res.json();

                document.getElementById('gameId').innerText = data.game_id;
                document.getElementById('dispFee').innerText = data.entry_fee;
                document.getElementById('playerCount').innerText = data.joined_count;
                document.getElementById('prizeDisplay').innerText = data.prize_amount;

                isJoined = data.joined_players.includes(tgId);

                const joinContainer = document.getElementById('joinContainer');
                const joinedStatus = document.getElementById('joinedStatus');
                const boardEl = document.getElementById('board');
                const bingoBtn = document.getElementById('bingoBtn');
                const newGameBtn = document.getElementById('newGameBtn');
                const statusText = document.getElementById('gameStatusText');

                if (isJoined) {
                    joinContainer.classList.add('hidden');
                    joinedStatus.classList.remove('hidden');
                } else {
                    joinContainer.classList.remove('hidden');
                    joinedStatus.classList.add('hidden');
                }

                calledNumbersList = data.called_numbers || [];
                let patternText = data.pattern === 'any_line' ? '1 መስመር' : (data.pattern === 'two_lines' ? '2 መስመር' : 'Full House (ሙሉ ቦርድ)');

                if (data.status === 'waiting') {
                    statusText.innerText = `🔄 አድሚኑ ጨዋታውን እስኪጀምር ይበቁ... (ህግ፦ ${patternText})`;
                    bingoBtn.disabled = true;
                    boardEl.classList.add('disabled-cell');
                    newGameBtn.classList.add('hidden');
                    gameEnded = false;
                } else if (data.status === 'running') {
                    statusText.innerText = `🟢 ጨዋታው በሂደት ላይ ነው! (ህግ፦ ${patternText})`;
                    if (isJoined) {
                        bingoBtn.disabled = false;
                        boardEl.classList.remove('disabled-cell');
                    } else {
                        bingoBtn.disabled = true;
                        boardEl.classList.add('disabled-cell');
                    }
                    newGameBtn.classList.add('hidden');
                } else if (data.status === 'ended' && !gameEnded) {
                    gameEnded = true;
                    bingoBtn.disabled = true;
                    boardEl.classList.add('disabled-cell');
                    newGameBtn.classList.remove('hidden');
                    showWinnerModal(data.winner, data.winning_number, data.prize_amount);
                }

                if (data.called_numbers.length > 0) {
                    const lastCall = data.called_numbers[data.called_numbers.length - 1];
                    document.getElementById('currentNum').innerText = lastCall;

                    const historyEl = document.getElementById('ballsHistory');
                    historyEl.innerHTML = '';
                    [...data.called_numbers].reverse().forEach(num => {
                        const b = document.createElement('div');
                        b.classList.add('small-ball');
                        b.innerText = num;
                        historyEl.appendChild(b);
                    });
                } else {
                    document.getElementById('currentNum').innerText = '--';
                    document.getElementById('ballsHistory').innerHTML = '';
                }
            } catch (e) {}
        }

        async function claimBingo() {
            if (!isJoined) return alert("በጨዋታው አልተሳተፉም!");

            const markedCells = document.querySelectorAll('.cell.marked');
            const markedIndices = Array.from(markedCells).map(c => parseInt(c.dataset.index));

            const res = await fetch('/api/claim_bingo', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ 
                    player_name: currentUser.name,
                    telegram_id: tgId,
                    board: currentBoardState,
                    marked_indices: markedIndices
                })
            });
            const data = await res.json();

            if (data.status === 'invalid') {
                alert(data.message);
            }
        }

        function showWinnerModal(winner, winningNum, prize) {
            const modal = document.getElementById('winModal');
            if (winner === currentUser.name) {
                document.getElementById('winTitle').innerText = "🎉 እንኳን ደስ አለህ!";
                document.getElementById('winMessage').innerText = `በመጨረሻው ጥሪ (${winningNum}) አሸንፈሃል! 🏆\n ያሸነፉት ገንዘብ፦ ${prize} ETB`;
            } else {
                document.getElementById('winTitle').innerText = "🏁 ጨዋታው ተጠናቋል!";
                document.getElementById('winMessage').innerText = `ተጫዋች ${winner} በመጨረሻው ጥሪ (${winningNum}) አሸንፏል!`;
            }
            modal.style.display = 'flex';
        }

        function closeModalAndPrepare() {
            document.getElementById('winModal').style.display = 'none';
        }

        function resetForNewGame() {
            generateStandardBingoBoard();
            document.getElementById('newGameBtn').classList.add('hidden');
            document.getElementById('currentNum').innerText = '--';
            document.getElementById('ballsHistory').innerHTML = '';
            alert("አዲስ የቢንጎ ቦርድ ተዘጋጅቷል! አድሚኑ አዲስ ጨዋታ እስኪጀምር ይበቁ።");
        }

        checkUser();
    </script>
</body>
</html>
