<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <title>Admin - Users</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; padding: 20px; }
        .card { background: #1a1a1a; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .nav { margin-bottom: 15px; }
        .nav a { color: #ff9800; margin-right: 15px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <h2>👥 የተጠቃሚዎች ዝርዝር</h2>
    <div class="nav">
        <a href="/admin">ዲፖዚቶች</a>
        <a href="/admin/users">ተጠቃሚዎች</a>
        <a href="/admin/history">ታሪክ</a>
    </div>
    <div class="card">
        <div id="users">መረጃ በመጫን ላይ...</div>
    </div>

    <script>
        fetch('/api/admin/data')
        .then(res => res.json()).then(data => {
            const userDiv = document.getElementById('users');
            if(!data.users || data.users.length === 0) {
                userDiv.innerHTML = 'ምንም ተጠቃሚ የለም።';
            } else {
                userDiv.innerHTML = '';
                data.users.forEach(u => {
                    userDiv.innerHTML += `<p>${u.phone} - <b>${u.balance} ETB</b></p>`;
                });
            }
        });
    </script>
</body>
</html>
