<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የተጫዋቾች ዝርዝር - ET BINGO Admin</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 15px; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .btn { padding: 8px 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; background: #2ecc71; color: white; }
        .btn-back { background: #7f8c8d; text-decoration: none; color: white; padding: 8px 15px; border-radius: 6px; display: inline-block; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #333; padding: 10px; text-align: left; font-size: 14px; }
        th { background: #2c2c2e; }
        input[type="number"] { width: 70px; padding: 6px; border-radius: 4px; border: 1px solid #444; background: #121212; color: white; }
        .no-data { text-align: center; color: #888; padding: 20px; }
    </style>
</head>
<body>

    <a href="/admin" class="btn-back">⬅️ ወደ አድሚን ዋና ገፅ ተመለስ</a>

    <div class="card">
        <h2>👥 የተጫዋቾች ዝርዝር እና ባላንስ መሙያ (Deposit)</h2>
        <table>
            <thead>
                <tr>
                    <th>ስም</th>
                    <th>ስልክ</th>
                    <th>ባላንስ</th>
                    <th>መሙያ (Deposit)</th>
                </tr>
            </thead>
            <tbody id="userTable">
                <tr><td colspan="4" class="no-data">መረጃዎች እየጫኑ ነው... ⏳</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        let isTyping = false;

        async function fetchUsers() {
            // ተጠቃሚው ብር እየጻፈ ከሆነ Table እንዳይቀየር/እንዳይታደስ ይከለክላል
            if (isTyping) return;

            try {
                const res = await fetch('/api/admin/users');
                const data = await res.json();

                const userTable = document.getElementById('userTable');

                if (!data.users || data.users.length === 0) {
                    userTable.innerHTML = '<tr><td colspan="4" class="no-data">ምንም የተመዘገበ ተጫዋች የለም! 📭</td></tr>';
                    return;
                }

                userTable.innerHTML = '';
                data.users.forEach(u => {
                    userTable.innerHTML += `
                        <tr>
                            <td><b>${u.name}</b></td>
                            <td>${u.phone}</td>
                            <td><b style="color:#2ecc71;">${u.balance}</b> ETB</td>
                            <td>
                                <input type="number" id="amt_${u.telegram_id}" placeholder="ብር" onfocus="isTyping=true" onblur="isTyping=false">
                                <button class="btn" onclick="addBalance(${u.telegram_id})">+</button>
                            </td>
                        </tr>
                    `;
                });
            } catch(e) {
                console.error("Error fetching users:", e);
            }
        }

        async function addBalance(tgId) {
            const amtInput = document.getElementById(`amt_${tgId}`);
            const amt = amtInput.value;
            if(!amt || amt <= 0) return alert("እባክዎ ትክክለኛ የብር መጠን ያስገቡ!");

            await fetch('/api/admin/update_balance', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ telegram_id: tgId, amount: amt })
            });

            amtInput.value = '';
            isTyping = false;
            fetchUsers();
        }

        // በየ 3 ሴኮንዱ ዳታውን ያድሳል
        setInterval(fetchUsers, 3000);
        fetchUsers();
    </script>
</body>
</html>
