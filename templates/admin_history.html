<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <title>Admin - History</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; padding: 20px; }
        .card { background: #1a1a1a; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .nav { margin-bottom: 15px; }
        .nav a { color: #ff9800; margin-right: 15px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <h2>📊 የጨዋታ ታሪክ (History)</h2>
    <div class="nav">
        <a href="/admin">ዲፖዚቶች</a>
        <a href="/admin/users">ተጠቃሚዎች</a>
        <a href="/admin/history">ታሪክ</a>
    </div>
    <div class="card">
        <div id="history">ምንም የተጠናቀቀ ጨዋታ የለም።</div>
    </div>

    <script>
        fetch('/api/admin/data')
        .then(res => res.json()).then(data => {
            const histDiv = document.getElementById('history');
            if(data.history && data.history.length > 0) {
                histDiv.innerHTML = '';
                data.history.forEach(h => {
                    histDiv.innerHTML += `<p>${h}</p>`;
                });
            }
        });
    </script>
</body>
</html>
