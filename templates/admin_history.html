<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የጨዋታዎች ታሪክ - ET BINGO Admin</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 15px; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .btn-back { background: #7f8c8d; text-decoration: none; color: white; padding: 8px 15px; border-radius: 6px; display: inline-block; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #333; padding: 10px; text-align: left; font-size: 13px; }
        th { background: #2c2c2e; }
    </style>
</head>
<body>

    <a href="/admin" class="btn-back">⬅️ ወደ አድሚን ዋና ገፅ ተመለስ</a>

    <div class="card">
        <h2>📜 የጨዋታዎች ታሪክ (Game History)</h2>
        <table>
            <thead>
                <tr>
                    <th>Game ID</th>
                    <th>አሸናፊ ተጫዋች</th>
                    <th>የማሸነፊያ ጥሪ</th>
                    <th>የነበረው ህግ</th>
                    <th>ሰዓት</th>
                </tr>
            </thead>
            <tbody id="historyTable"></tbody>
        </table>
    </div>

    <script>
        async function fetchHistory() {
            try {
                const res = await fetch('/api/admin/data');
                const data = await res.json();

                const historyTable = document.getElementById('historyTable');
                historyTable.innerHTML = '';
                data.history.forEach(h => {
                    const patternName = h.pattern === 'any_line' ? '1 መስመር' : (h.pattern === 'two_lines' ? '2 መስመር' : 'Full House');
                    historyTable.innerHTML += `
                        <tr>
                            <td>#${h.game_id}</td>
                            <td style="color:#2ecc71; font-weight:bold;">${h.winner}</td>
                            <td><b style="color:#f1c40f;">${h.winning_number}</b></td>
                            <td>${patternName}</td>
                            <td>${h.time}</td>
                        </tr>
                    `;
                });
            } catch(e) {}
        }

        setInterval(fetchHistory, 3000);
        fetchHistory();
    </script>
</body>
</html>
